<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>登录失败</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
        font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    }

    .card {
        width: 420px;
        background: white;
        border-radius: 16px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #fef2f2;
        color: #dc2626;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: bold;
    }

    .title {
        font-size: 28px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 12px;
    }

    .desc {
        font-size: 15px;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 32px;
    }

    .tip {
        margin-top: 18px;
        font-size: 13px;
        color: #9ca3af;
    }
</style>
</head>

<body>

<div class="card">
    <div class="icon">&#10007;</div>

    <div class="title">登录失败</div>

    <div class="desc">{{ERROR_MSG}}</div>

    <div class="tip">请返回终端查看错误信息并重试。</div>
</div>

</body>
</html>
