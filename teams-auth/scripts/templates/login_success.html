<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>登录成功</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            width: 420px;
            background: white;
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ecfdf3;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 12px;
        }

        .tip {
            margin-top: 18px;
            font-size: 13px;
            color: #9ca3af;
        }

        .user-info {
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #f9fafb;
            border-radius: 10px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #f3f4f6;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 14px;
            color: #9ca3af;
        }

        .info-value {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">&#10003;</div>

    <div class="title">登录成功</div>

    {{USER_INFO}}

</div>

</body>
</html>
