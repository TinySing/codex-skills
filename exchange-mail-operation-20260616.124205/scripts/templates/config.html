<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange 邮箱配置</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 48px;
            width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-icon {
            font-size: 48px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .server-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #555;
            line-height: 1.8;
        }

        .server-info span {
            color: #333;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrap input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .input-wrap .suffix {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 14px;
            pointer-events: none;
        }

        .input-wrap.has-suffix input {
            padding-right: 110px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #d9d9d9;
            transform: none;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }

        .error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="logo"><span class="logo-icon">📧</span></div>
    <h1>Exchange 邮箱配置</h1>
    <div class="subtitle">连接您的 Exchange 邮箱</div>
    <div class="server-info">
        服务器：<span>{{SERVER}}</span><br>
        域名：<span>{{DOMAIN}}</span><br>
        邮箱后缀：<span>{{EMAIL_SUFFIX}}</span>
    </div>
    <form id="configForm">
        <label for="username">用户名</label>
        <div class="input-wrap has-suffix">
            <input type="text" id="username" name="username" placeholder="请输入 @ 前面的部分" autocomplete="off"
                   required>
            <span class="suffix">{{EMAIL_SUFFIX}}</span>
        </div>
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入邮箱密码" required>
        <button type="submit" id="submitBtn">配置并连接</button>
    </form>
    <div id="result" class="result"></div>
</div>
<script>
    document.getElementById('configForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        btn.disabled = true;
        btn.innerHTML = '<span class="loading"></span>配置中...';
        result.style.display = 'none';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
            const resp = await fetch('/configure', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
            });
            const data = await resp.json();
            result.style.display = 'block';
            if (data.success) {
                result.className = 'result success';
                result.innerHTML = '✅ ' + data.message;
                btn.innerHTML = '✅ 配置成功';
            } else {
                result.className = 'result error';
                result.innerHTML = '❌ ' + data.message;
                btn.disabled = false;
                btn.innerHTML = '配置并连接';
            }
        } catch (err) {
            result.style.display = 'block';
            result.className = 'result error';
            result.innerHTML = '❌ 请求失败: ' + err.message;
            btn.disabled = false;
            btn.innerHTML = '配置并连接';
        }
    });
</script>
</body>
</html>
